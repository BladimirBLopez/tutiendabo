<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <meta name="theme-color" content="#c27e4a" id="meta-theme-color">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mi Tienda" id="meta-app-title">
  <link rel="manifest" id="pwa-manifest" href="">
  <link rel="icon" id="favicon" href="">
  <link rel="apple-touch-icon" id="apple-icon" href="">
  <title>Mi Tienda</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&family=Baloo+2:wght@400;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/supabase.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    :root {
      --brand: #c27e4a;
      --brand-dk: #8b4513;
      --brand-lt: #fff3e8;
      --bg: #fef8f0;
      --card: #ffffff;
      --text: #1a1a1a;
      --muted: #888;
      --border: #e8ddd2;
      --radius: 14px;
      --btn-text: #ffffff;
    }

    body { font-family:'Poppins',sans-serif; background:var(--bg); min-height:100vh; overflow-x:hidden; }
    html { overflow-x:hidden; }

    /* ── Oculto ── */
    .oculto { display:none !important; }

    /* ── PÁGINA TIENDA ── */
    #pagina-tienda { padding-bottom:90px; }

    .portada-full { width:100%; background:var(--brand); min-height:150px; position:relative; }
    .portada-img { width:100%; max-height:220px; object-fit:cover; display:block; }

    .btn-compartir-icon {
      position:absolute; top:14px; right:14px; z-index:5;
      width:38px; height:38px; border-radius:50%; border:none;
      background:rgba(0,0,0,.35); color:#fff; backdrop-filter:blur(4px);
      display:flex; align-items:center; justify-content:center;
      cursor:pointer;
    }
    .btn-compartir-icon svg { width:18px; height:18px; }

    .logo-wrapper {
      display:flex; justify-content:center;
      position:relative; z-index:20;
      margin-top:-55px; margin-bottom:-55px;
    }
    .logo-img {
      width:110px; height:110px; object-fit:cover;
      border-radius:50%; background:white;
      border:4px solid white; box-shadow:0 4px 20px rgba(0,0,0,.15);
    }
    .logo-placeholder {
      width:110px; height:110px; border-radius:50%;
      background:white; border:4px solid white; box-shadow:0 4px 20px rgba(0,0,0,.15);
      display:flex; align-items:center; justify-content:center;
      font-size:2.2rem;
    }

    .content-card {
      background:white; border-radius:0 0 40px 40px;
      box-shadow:0 10px 30px rgba(0,0,0,.05);
      padding-bottom:30px;
    }

    .container { max-width:500px; margin:0 auto; padding:70px 20px 0; }

    .description-section { text-align:center; margin-bottom:12px; }
    .description-section h2 {
      font-family:var(--font-titulo, 'Playfair Display', serif); font-size:1.4rem;
      font-weight:600; color:var(--text); margin-bottom:4px;
    }
    .description-section p { color:var(--muted); font-size:.8rem; line-height:1.5; }

    .social-links { display:flex; justify-content:center; gap:10px; margin:6px 0 12px; }
    .social-btn {
      width:40px; height:40px; border-radius:50%;
      background:#f5f5f5; display:flex; align-items:center; justify-content:center;
      color:#555; text-decoration:none; transition:all .2s;
    }
    .social-btn:hover { background:#eee; color:#333; transform:scale(1.08); }
    .social-btn svg { width:22px; height:22px; }

    .whatsapp-badge {
      background:#f5f5f5; color:#333; padding:8px 18px;
      margin:0 0 20px; border-radius:50px; text-align:center;
      font-size:.82rem; font-weight:500;
      display:inline-flex; align-items:center; justify-content:center;
      gap:8px; width:100%;
    }
    .icon-wa { width:10px; height:10px; background:#333; border-radius:50%; flex-shrink:0; }

    .share-qr-img { width:170px; height:170px; border-radius:12px; border:1px solid var(--border); margin:0 auto 16px; display:block; }
    .share-link-box {
      display:flex; align-items:center; gap:8px; background:#f5f5f5;
      border-radius:10px; padding:10px 12px; margin-bottom:14px;
    }
    .share-link-box span { flex:1; font-size:.78rem; color:#555; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .share-link-box button {
      background:var(--brand); color:var(--btn-text,#fff); border:none; border-radius:8px;
      padding:6px 12px; font-size:.75rem; font-weight:600; cursor:pointer; flex-shrink:0;
    }
    .btn-share-native {
      width:100%; background:var(--brand); color:var(--btn-text,#fff); border:none;
      border-radius:10px; padding:12px; font-size:.85rem; font-weight:600;
      display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;
    }

    /* ── Categorías ── */

    .categories-wrapper { width:100%; overflow-x:auto; margin-bottom:20px; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
    .categories-wrapper::-webkit-scrollbar { display:none; }
    .categories { display:flex; gap:10px; width:max-content; min-width:100%; padding-bottom:4px; }

    .category-btn {
      padding:8px 18px; border-radius:50px; border:1.5px solid var(--border);
      background:#fafafa; font-family:'Poppins',sans-serif;
      font-size:.8rem; font-weight:500; color:var(--muted);
      cursor:pointer; transition:all .2s; white-space:nowrap;
    }
    .category-btn.active { background:var(--brand); border-color:var(--brand); color:#fff; }

    /* ── Productos ── */
    .products-list {
      display:grid;
      grid-template-columns:repeat(2, 1fr);
      gap:12px;
    }

    .product-card {
      background:var(--card); border-radius:16px;
      border:1px solid var(--border); overflow:hidden;
      box-shadow:0 2px 12px rgba(0,0,0,.06);
      transition:transform .2s, box-shadow .2s;
      display:flex; flex-direction:column;
    }
    .product-card:active { transform:scale(.97); }

    .product-img-wrap { position:relative; overflow:hidden; background:var(--brand-lt); }
    .product-img {
      width:100%; aspect-ratio:1/1; object-fit:cover; display:block;
      cursor:pointer; transition:transform .4s;
    }
    .product-img:hover { transform:scale(1.06); }

    .badge-estado {
      position:absolute; top:8px; left:8px;
      padding:3px 9px; border-radius:20px;
      font-size:.65rem; font-weight:700;
      pointer-events:none; z-index:10;
    }
    .badge-nuevo   { background:#25d366; color:#fff; }
    .badge-agotado { background:rgba(0,0,0,.6); color:#fff; }
    .badge-oferta  { background:#e74c3c; color:#fff; }

    .img-agotado { opacity:.5; filter:grayscale(.5); }

    .img-count-badge {
      position:absolute; bottom:7px; right:7px;
      background:rgba(0,0,0,.45); color:#fff;
      font-size:.65rem; padding:2px 7px; border-radius:20px;
      pointer-events:none; backdrop-filter:blur(4px);
    }

    .img-dots {
      position:absolute; bottom:7px; left:50%; transform:translateX(-50%);
      display:flex; gap:4px;
    }
    .img-dot { width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,.5); }
    .img-dot.active { background:#fff; }

    .product-info {
      padding:10px 11px 12px;
      display:flex; flex-direction:column; flex:1;
    }
    .product-name {
      font-family:var(--font-titulo, 'Poppins', sans-serif);
      font-size:.82rem; font-weight:700; color:var(--text);
      line-height:1.3; margin-bottom:3px;
      display:-webkit-box; -webkit-line-clamp:2;
      -webkit-box-orient:vertical; overflow:hidden;
    }
    .product-desc {
      font-size:.7rem; color:var(--muted); line-height:1.4; margin-bottom:5px;
      display:-webkit-box; -webkit-line-clamp:2;
      -webkit-box-orient:vertical; overflow:hidden;
    }
    .product-price {
      font-size:.88rem; color:var(--brand); font-weight:700; margin-bottom:6px;
    }

    .product-tallas { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:8px; }
    .talla-badge {
      padding:2px 7px; border-radius:20px; font-size:.65rem;
      border:1.5px solid var(--border); color:var(--muted); font-weight:600;
    }

    .btn-pedir {
      display:flex; align-items:center; justify-content:center; gap:5px;
      padding:9px 6px; border-radius:10px; border:none;
      background:var(--brand); color:var(--btn-text);
      font-family:'Poppins',sans-serif; font-size:.75rem; font-weight:600;
      cursor:pointer; width:100%; transition:background .2s; margin-top:auto;
    }
    .btn-pedir:hover { background:var(--brand-dk); }
    .btn-pedir svg { width:13px; height:13px; flex-shrink:0; }

    /* ── Carrito ── */
    .barra-contacto {
      position:fixed; bottom:0; left:0; right:0;
      background:#fff; border-top:1px solid var(--border);
      padding:12px 20px; display:flex; align-items:center;
      justify-content:space-between; z-index:100;
      box-shadow:0 -4px 20px rgba(0,0,0,.06);
    }
    .barra-info { display:flex; align-items:center; gap:10px; }
    .barra-info svg { width:26px; height:26px; color:var(--brand); }
    .barra-titulo { font-size:.9rem; font-weight:600; color:var(--text); }
    .barra-subtitulo { font-size:.75rem; color:var(--muted); }
    .barra-btn {
      background:var(--brand); color:#fff; border:none;
      padding:10px 18px; border-radius:10px;
      font-family:'Poppins',sans-serif; font-size:.82rem; font-weight:600;
      cursor:pointer; display:flex; align-items:center; gap:6px;
    }
    .carrito-count {
      background:var(--brand-dk); color:#fff;
      width:20px; height:20px; border-radius:50%;
      display:inline-flex; align-items:center; justify-content:center;
      font-size:.7rem; font-weight:700;
    }

    /* ── Popup producto ── */
    .popup-overlay {
      display:none; position:fixed; inset:0;
      background:rgba(0,0,0,.5); z-index:500;
      align-items:flex-end; justify-content:center;
      backdrop-filter:blur(4px);
    }
    .popup-overlay.open { display:flex; }

    .popup-sheet {
      background:#fff; width:100%; max-width:480px;
      border-radius:24px 24px 0 0;
      padding:0 0 34px;
      animation:slideUp .28s cubic-bezier(.32,1,.32,1);
      max-height:90vh; overflow-y:auto;
    }
    @keyframes slideUp { from { transform:translateY(100%); } to { transform:translateY(0); } }

    .popup-handle {
      width:40px; height:4px; background:#e0e0e0;
      border-radius:4px; margin:12px auto 0;
    }

    .popup-product-row {
      display:flex; gap:14px; align-items:center;
      padding:18px 20px 14px;
      border-bottom:1px solid var(--border);
    }
    .popup-thumb {
      width:70px; height:70px; object-fit:cover;
      border-radius:12px; flex-shrink:0;
      background:var(--brand-lt);
    }
    .popup-thumb-empty {
      width:70px; height:70px; border-radius:12px;
      background:var(--brand-lt); flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
      font-size:2rem;
    }
    .popup-prod-nombre { font-size:.95rem; font-weight:700; color:var(--text); }
    .popup-prod-precio { font-size:.85rem; color:var(--brand); font-weight:600; margin-top:2px; }
    .popup-prod-desc   { font-size:.75rem; color:var(--muted); margin-top:3px; line-height:1.4; }

    .popup-section { padding:16px 20px 0; }
    .popup-section-title {
      font-size:.75rem; font-weight:700; color:var(--muted);
      text-transform:uppercase; letter-spacing:.5px; margin-bottom:10px;
    }

    .tallas-grid { display:flex; flex-wrap:wrap; gap:8px; }
    .talla-btn {
      min-width:48px; padding:8px 14px; border-radius:10px;
      border:1.5px solid var(--border); background:#fafafa;
      font-family:'Poppins',sans-serif; font-size:.82rem; font-weight:600;
      color:var(--muted); cursor:pointer; transition:all .15s; text-align:center;
    }
    .talla-btn.selected {
      background:var(--brand); border-color:var(--brand);
      color:#fff; transform:scale(1.05);
      box-shadow:0 3px 10px rgba(0,0,0,.15);
    }

    .popup-acciones { padding:20px 20px 0; display:flex; flex-direction:column; gap:10px; }

    .btn-popup-agregar {
      display:flex; align-items:center; justify-content:center; gap:8px;
      padding:14px; border-radius:14px; border:none;
      background:var(--brand); color:var(--btn-text);
      font-family:'Poppins',sans-serif; font-size:.9rem; font-weight:700;
      cursor:pointer; transition:all .2s; width:100%;
    }
    .btn-popup-agregar:hover { background:var(--brand-dk); }
    .btn-popup-agregar:disabled { opacity:.4; cursor:not-allowed; }

    .btn-popup-consultar {
      display:flex; align-items:center; justify-content:center; gap:8px;
      padding:13px; border-radius:14px;
      border:1.5px solid #25d366; background:#f0fdf4; color:#15803d;
      font-family:'Poppins',sans-serif; font-size:.88rem; font-weight:600;
      cursor:pointer; transition:all .2s; width:100%; text-decoration:none;
    }
    .btn-popup-consultar:hover { background:#dcfce7; }

    .popup-talla-aviso {
      font-size:.72rem; color:var(--danger); text-align:center;
      display:none; margin-top:-4px;
    }

    /* ── PÁGINA CARRITO ── */
    #pagina-carrito { padding-bottom:90px; }
    .admin-header {
      display:flex; align-items:center; justify-content:space-between;
      padding:16px 20px; background:#fff;
      border-bottom:1px solid var(--border);
      position:sticky; top:0; z-index:50;
    }
    .btn-back {
      background:none; border:none; color:var(--brand);
      font-family:'Poppins',sans-serif; font-size:.9rem;
      font-weight:600; cursor:pointer;
    }
    .admin-header h2 { font-size:1rem; font-weight:700; }

    #carrito-items { padding:16px 20px; }

    .carrito-item {
      display:flex; gap:12px; align-items:flex-start;
      padding:14px 0; border-bottom:1px solid var(--border);
    }
    .carrito-thumb {
      width:60px; height:60px; object-fit:cover;
      border-radius:10px; flex-shrink:0;
    }
    .carrito-thumb-empty {
      width:60px; height:60px; border-radius:10px;
      background:var(--brand-lt); flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
      font-size:1.4rem;
    }
    .carrito-item-info { flex:1; }
    .carrito-item-name { font-size:.88rem; font-weight:600; }
    .carrito-item-talla { font-size:.75rem; color:var(--muted); margin:2px 0; }
    .carrito-item-precio { font-size:.82rem; font-weight:600; color:var(--brand-dk); }
    .btn-quitar {
      background:#fdecea; border:none; border-radius:8px;
      color:#e74c3c; font-size:.7rem; font-weight:600;
      padding:5px 10px; cursor:pointer;
    }

    .carrito-total {
      display:flex; justify-content:space-between;
      padding:16px 20px; font-weight:700; font-size:1rem;
    }

    .btn-enviar-wa {
      display:flex; align-items:center; justify-content:center; gap:8px;
      background:#25d366; color:#fff;
      text-decoration:none; padding:14px;
      border-radius:12px; margin:0 20px 12px;
      font-family:'Poppins',sans-serif; font-weight:600; font-size:.95rem;
    }

    .btn-vaciar {
      display:block; text-align:center; width:calc(100% - 40px);
      margin:0 20px; padding:12px; border-radius:12px;
      border:1.5px solid var(--border); background:none;
      font-family:'Poppins',sans-serif; font-size:.85rem;
      font-weight:600; color:var(--muted); cursor:pointer;
    }

    /* ── Lightbox ── */
    #lightbox-overlay {
      display:none; position:fixed; inset:0;
      background:rgba(0,0,0,.88); z-index:9999;
      justify-content:center; align-items:center;
      padding:16px; backdrop-filter:blur(6px);
    }
    #lightbox-overlay.open { display:flex; }
    #lightbox-content {
      position:relative; max-width:92vw; max-height:92vh;
      display:flex; flex-direction:column; align-items:center; gap:10px;
    }
    #lightbox-img {
      max-width:100%; max-height:75vh; object-fit:contain;
      border-radius:14px; box-shadow:0 10px 50px rgba(0,0,0,.6);
    }
    #lightbox-nombre { color:#fff; font-size:.95rem; font-weight:500; text-align:center; }
    #lightbox-dots { display:flex; gap:6px; }
    .lb-dot { width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,.35); }
    .lb-dot.active { background:#fff; }

    #lightbox-cerrar {
      position:absolute; top:-44px; right:-4px;
      background:rgba(255,255,255,.15); border:none; color:#fff;
      font-size:1.3rem; width:36px; height:36px; border-radius:50%;
      cursor:pointer; display:flex; align-items:center; justify-content:center;
    }

    #lightbox-prev, #lightbox-next {
      position:absolute; top:50%; transform:translateY(-50%);
      background:rgba(255,255,255,.22); border:none; color:#fff;
      font-size:1.8rem; width:40px; height:40px; border-radius:50%;
      cursor:pointer; display:flex; align-items:center; justify-content:center;
      backdrop-filter:blur(4px);
    }
    #lightbox-prev { left:8px; }
    #lightbox-next { right:8px; }

    /* ── Loading ── */
    .loading { text-align:center; padding:40px; color:var(--muted); }
    .spinner {
      display:inline-block; width:24px; height:24px;
      border:3px solid var(--border); border-top-color:var(--brand);
      border-radius:50%; animation:spin .7s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }

    #pantalla-carga-inicial {
      position:fixed; inset:0; z-index:9999;
      background:var(--bg); display:flex; align-items:center; justify-content:center;
    }
    #pantalla-carga-inicial .spinner { width:34px; height:34px; border-width:3px; }
    #pantalla-carga-inicial.oculto { display:none; }
  </style>
</head>
<body>

<!-- ═══ CARGA INICIAL ═══ -->
<div id="pantalla-carga-inicial">
  <div class="spinner"></div>
</div>

<!-- ═══ TIENDA ═══ -->
<div id="pagina-tienda" style="visibility:hidden;">

  <!-- Portada -->
  <div class="portada-full" id="portada-wrap">
    <img id="portada-img" src="" alt="Portada" class="portada-img" style="display:none;">
    <button class="btn-compartir-icon" onclick="abrirCompartir()" title="Compartir tienda">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
    </button>
  </div>

  <!-- Logo -->
  <div class="logo-wrapper">
    <div class="logo-placeholder" id="logo-placeholder">🏬</div>
    <img id="logo-img" src="" alt="Logo" class="logo-img" style="display:none;">
  </div>

  <!-- Contenido -->
  <div class="content-card">
    <div class="container">

      <div class="description-section">
        <h2 id="tienda-nombre">Mi Tienda</h2>
        <p id="tienda-descripcion"></p>
      </div>

      <!-- Redes sociales -->
      <div class="social-links" id="social-links" style="display:none;">
        <a id="link-facebook" href="#" class="social-btn" target="_blank" style="display:none;">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
        </a>
        <a id="link-instagram" href="#" class="social-btn" target="_blank" style="display:none;">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.16c3.2 0 3.58.01 4.85.07 3.25.15 4.77 1.69 4.92 4.92.06 1.27.07 1.65.07 4.85s-.01 3.58-.07 4.85c-.15 3.23-1.66 4.77-4.92 4.92-1.27.06-1.64.07-4.85.07s-3.58-.01-4.85-.07c-3.26-.15-4.77-1.7-4.92-4.92-.06-1.27-.07-1.65-.07-4.85s.02-3.58.07-4.85c.15-3.23 1.67-4.77 4.92-4.92 1.27-.06 1.65-.07 4.85-.07zM12 0C8.74 0 8.33.01 7.05.07 2.7.27.27 2.69.07 7.05.01 8.33 0 8.74 0 12s.01 3.67.07 4.95c.2 4.36 2.62 6.78 6.98 6.98 1.28.06 1.69.07 4.95.07s3.67-.01 4.95-.07c4.35-.2 6.78-2.62 6.98-6.98.06-1.28.07-1.69.07-4.95s-.01-3.67-.07-4.95C23.72 2.7 21.3.27 16.95.07 15.67.01 15.26 0 12 0zm0 5.84A6.16 6.16 0 1 0 18.16 12 6.16 6.16 0 0 0 12 5.84zM12 16a4 4 0 1 1 4-4 4 4 0 0 1-4 4zm6.41-10.85a1.44 1.44 0 1 0 1.44 1.44 1.44 1.44 0 0 0-1.44-1.44z"/></svg>

<script>
// ══════════════════════════════════════════════
//  ESTADO GLOBAL
// ══════════════════════════════════════════════
// Dominio oficial de la plataforma (para que "Compartir tienda" siempre
// muestre este link, sin importar desde qué dominio esté entrando el cliente)
const DOMINIO_PUBLICO = 'https://tutiendabo.online';

let configTienda = {};
let categorias = [];
let productos = [];
let productosFiltrados = [];
let lbImagenes = [];
let lbIndex = 0;
let categoriaActiva = '';
let moneda = 'Bs.';
let tiendaId = null;

// Carrito separado por tienda
const carritoKey = () => `carrito_${getShopSlug() || 'default'}`;
let carrito = JSON.parse(localStorage.getItem(carritoKey()) || '[]');

// ══════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════

// Pantalla de respaldo (slug vacío o tienda no encontrada).
// Autocontenida: reemplaza todo el <body>, así que no depende de sprites ni CSS externo.
function paginaFallback(iconoSvgPaths, titulo, mensaje) {
  document.body.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;font-family:'Inter',sans-serif;background:#F6F5F3;">
      <div style="max-width:340px;text-align:center;">
        <div style="width:64px;height:64px;border-radius:50%;background:#FBEEE3;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;">
          <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#B25A28" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${iconoSvgPaths}</svg>
        </div>
        <h2 style="margin:0 0 8px;color:#1C1B1A;font-size:1.15rem;">${titulo}</h2>
        <p style="color:#6F6B67;font-size:.85rem;line-height:1.6;margin:0;">${mensaje}</p>
      </div>
    </div>
  `;
}

document.addEventListener('DOMContentLoaded', async () => {
  // Red de seguridad: si algo se cuelga sin dar error, no dejar la pantalla de carga pegada para siempre
  const limiteSeguridad = setTimeout(() => {
    document.getElementById('pantalla-carga-inicial')?.classList.add('oculto');
    const pt = document.getElementById('pagina-tienda');
    if (pt) pt.style.visibility = 'visible';
  }, 8000);

  const slug = getShopSlug();
  if (!slug) {
    paginaFallback(
      '<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/>',
      'TuTiendaBo',
      'Ingresa a través del link de tu tienda para verla aquí.'
    );
    return;
  }

  let tienda;
  try {
    const resultado = await db.from('tiendas').select('*').eq('slug', slug).single();
    tienda = resultado.data;
  } catch (e) {
    clearTimeout(limiteSeguridad);
    paginaFallback(
      '<path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>',
      'Problema de conexión',
      'No se pudo cargar la tienda. Revisa tu conexión a internet e intenta de nuevo.'
    );
    return;
  }
  if (!tienda || !tienda.activa) {
    paginaFallback(
      '<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/>',
      'Tienda no encontrada',
      'Este link no corresponde a ninguna tienda activa. Verifica que esté bien escrito o pide el link actualizado.'
    );
    return;
  }
  tiendaId = tienda.id;

  try {
    actualizarContadorCarrito();
    incrementarVisita(); // no se espera, no debe bloquear la carga de la tienda
    await cargarConfig();
    await cargarCategorias();
    await cargarProductos();
  } finally {
    // Pase lo que pase, nunca dejar la pantalla de carga pegada
    clearTimeout(limiteSeguridad);
    document.getElementById('pantalla-carga-inicial').classList.add('oculto');
    document.getElementById('pagina-tienda').style.visibility = 'visible';
  }
});

// Cuenta una visita a la tienda (silencioso, no crítico si falla)
async function incrementarVisita() {
  try {
    await db.rpc('increment_visitas', { store_id: tiendaId });
  } catch (e) { /* no interrumpir la tienda si esto falla */ }
}

// ══════════════════════════════════════════════
//  CONFIG
// ══════════════════════════════════════════════
async function cargarConfig() {
  const { data } = await db.from('config_tienda').select('*').eq('tienda_id', tiendaId).single();
  if (!data) return;
  configTienda = data;
  moneda = data.moneda || 'Bs.';

  document.getElementById('tienda-nombre').textContent = data.nombre || 'Mi Tienda';
  document.getElementById('tienda-descripcion').textContent = data.descripcion || '';
  document.title = data.nombre || 'Mi Tienda';

  // Horario
  if (data.horario) {
    document.getElementById('horario-texto').textContent = data.horario;
    document.getElementById('horario-wrap').style.display = 'block';
  }

  // Fuente del título
  const FUENTES = {
    elegante: "'Playfair Display', serif",
    moderna:  "'Poppins', sans-serif",
    divertida: "'Baloo 2', cursive",
    clasica:  "'Montserrat', sans-serif"
  };
  const fuente = FUENTES[data.fuente] || FUENTES.elegante;
  document.documentElement.style.setProperty('--font-titulo', fuente);

  // Aplicar los 4 colores personalizados
  const colorBoton  = data.color_boton  || data.color_principal || '#c27e4a';
  const colorFondo  = data.color_fondo  || '#fef8f0';
  const colorTexto  = data.color_texto  || '#1a1a1a';
  const colorTxtBtn = data.color_texto_boton || '#ffffff';

  // Derivar brand-dk y brand-lt desde el color del botón
  const r  = parseInt(colorBoton.slice(1,3),16);
  const g  = parseInt(colorBoton.slice(3,5),16);
  const b  = parseInt(colorBoton.slice(5,7),16);
  const dk = `rgb(${Math.floor(r*.7)},${Math.floor(g*.7)},${Math.floor(b*.7)})`;
  const lt = `rgba(${r},${g},${b},0.1)`;

  document.documentElement.style.setProperty('--brand',    colorBoton);
  document.documentElement.style.setProperty('--brand-dk', dk);
  document.documentElement.style.setProperty('--brand-lt', lt);
  document.documentElement.style.setProperty('--bg',       colorFondo);
  document.documentElement.style.setProperty('--text',     colorTexto);
  document.documentElement.style.setProperty('--btn-text', colorTxtBtn);
  document.getElementById('meta-theme-color').content = colorBoton;

  // PWA — nombre y manifest dinámico
  const nombre = data.nombre || 'Mi Tienda';
  const color  = data.color_principal || '#c27e4a';
  const logo   = data.logo_url || '';
  const slug   = getShopSlug();

  document.getElementById('meta-app-title').content = nombre;

  const manifest = {
    name: nombre,
    short_name: nombre,
    start_url: `/${slug}`,
    display: 'standalone',
    background_color: '#fef8f0',
    theme_color: color,
    icons: logo ? [
      { src: logo, sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
      { src: logo, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
    ] : [
      { src: '/icon-192.png', sizes: '192x192', type: 'image/png' }
    ]
  };

  const blob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
  const manifestUrl = URL.createObjectURL(blob);
  document.getElementById('pwa-manifest').href = manifestUrl;
  if (logo) {
    document.getElementById('apple-icon').href = logo;
    document.getElementById('favicon').href = logo;
  }

  // Registrar service worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }

  if (data.logo_url) {
    document.getElementById('logo-placeholder').style.display = 'none';
    const img = document.getElementById('logo-img');
    img.src = data.logo_url; img.style.display = 'block';
  }
  if (data.portada_url) {
    const img = document.getElementById('portada-img');
    img.src = data.portada_url; img.style.display = 'block';
    document.querySelector('.portada-full').style.background = 'none';
  }

  if (data.mostrar_redes) {
    document.getElementById('social-links').style.display = 'flex';
    if (data.facebook) {
      const el = document.getElementById('link-facebook');
      el.href = data.facebook; el.style.display = 'flex';
    }
    if (data.instagram) {
      const el = document.getElementById('link-instagram');
      el.href = data.instagram; el.style.display = 'flex';
    }
    if (data.tiktok) {
      const el = document.getElementById('link-tiktok');
      el.href = data.tiktok; el.style.display = 'flex';
    }
    if (data.whatsapp) {
      const el = document.getElementById('link-whatsapp');
      el.href = `https://wa.me/${data.whatsapp}`; el.style.display = 'flex';
    }
    if (data.whatsapp_grupo) {
      const el = document.getElementById('link-whatsapp-grupo');
      el.href = data.whatsapp_grupo; el.style.display = 'flex';
    }
  }
}

// ══════════════════════════════════════════════
//  CATEGORÍAS
// ══════════════════════════════════════════════
async function cargarCategorias() {
  const { data } = await db.from('categorias').select('*').eq('tienda_id', tiendaId).order('orden');
  categorias = data || [];
  const lista = document.getElementById('lista-categorias');

  categorias.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'category-btn';
    btn.textContent = cat.nombre;
    btn.dataset.cat = cat.id;
    btn.onclick = () => filtrarPorCategoria(btn, cat.id);
    lista.appendChild(btn);
  });
}

function filtrarPorCategoria(btn, catId) {
  document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  categoriaActiva = catId;
  renderProductos(catId ? productos.filter(p => String(p.categoria_id) === String(catId)) : productos);
}

// ══════════════════════════════════════════════
//  PRODUCTOS
// ══════════════════════════════════════════════
async function cargarProductos() {
  const { data } = await db
    .from('productos')
    .select('*, categorias(nombre)')
    .eq('tienda_id', tiendaId)
    .eq('activo', true)
    .order('orden');
  productos = data || [];
  renderProductos(productos);
}

function renderProductos(lista) {
  const el = document.getElementById('lista-productos');

  if (!lista.length) {
    el.innerHTML = '<p style="text-align:center;color:#888;padding:30px;">No hay productos disponibles</p>';
    return;
  }

  el.innerHTML = '';
  lista.forEach(p => {
    const imgs = p.imagenes || [];
    const tallas = p.tallas || [];
    const mostrarPrecio = configTienda.mostrar_precios && p.precio > 0;

    const card = document.createElement('div');
    card.className = 'product-card';
    card.innerHTML = `
      <div class="product-img-wrap">
        ${imgs.length > 0
          ? `<img class="product-img${p.estado==='agotado'?' img-agotado':''}" src="${imgs[0]}" alt="${p.nombre}" loading="lazy"
              onclick="abrirLightbox('${p.id}', 0)">`
          : `<div style="width:100%;aspect-ratio:4/3;background:#f5f0ea;display:flex;align-items:center;justify-content:center;font-size:2.5rem;">🛍️</div>`}
        ${p.estado === 'nuevo'   ? `<div class="badge-estado badge-nuevo">🆕 Nuevo</div>` : ''}
        ${p.estado === 'agotado' ? `<div class="badge-estado badge-agotado">😔 Agotado</div>` : ''}
        ${p.estado === 'oferta'  ? `<div class="badge-estado badge-oferta">🔥 Oferta</div>` : ''}
        ${imgs.length > 1
          ? `<div class="img-count-badge">1 / ${imgs.length}</div>
             <div class="img-dots">
               ${imgs.map((_, i) => `<div class="img-dot${i===0?' active':''}"></div>`).join('')}
             </div>`
          : ''}
      </div>
      <div class="product-info">
        <div class="product-name">${p.nombre}</div>
        ${p.descripcion ? `<div class="product-desc">${p.descripcion}</div>` : ''}
        ${mostrarPrecio ? `
          <div class="product-price">
            ${p.en_descuento && p.precio_original > 0
              ? `<span style="text-decoration:line-through;color:var(--muted);font-size:.75rem;font-weight:500;margin-right:4px;">${moneda} ${p.precio_original.toFixed(2)}</span>`
              : ''}
            ${moneda} ${p.precio.toFixed(2)}
            ${p.en_descuento && p.precio_original > 0
              ? `<span style="background:#e74c3c;color:#fff;font-size:.62rem;font-weight:700;padding:2px 6px;border-radius:20px;margin-left:4px;">-${Math.round((1-p.precio/p.precio_original)*100)}%</span>`
              : ''}
          </div>` : ''}
        ${tallas.length > 0
          ? `<div class="product-tallas">${tallas.map(t => `<span class="talla-badge">${t}</span>`).join('')}</div>`
          : ''}
        <button class="btn-pedir" onclick="pedirProducto('${p.id}')"
          ${p.estado === 'agotado' ? 'disabled style="opacity:.5;cursor:not-allowed;background:#aaa;"' : ''}>
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.127.558 4.126 1.533 5.857L.057 23.428a.75.75 0 0 0 .921.921l5.571-1.476A11.943 11.943 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.75a9.712 9.712 0 0 1-4.953-1.355l-.355-.212-3.683.975.993-3.585-.232-.369A9.712 9.712 0 0 1 2.25 12C2.25 6.615 6.615 2.25 12 2.25S21.75 6.615 21.75 12 17.385 21.75 12 21.75z"/></svg>
          ${p.estado === 'agotado' ? 'Agotado' : 'Pedir por WhatsApp'}
        </button>
      </div>
    `;
    el.appendChild(card);

    // Swipe en la imagen
    if (imgs.length > 1) {
      const imgEl = card.querySelector('.product-img');
      let startX = 0;
      let startY = 0;
      imgEl.addEventListener('touchstart', e => {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      }, {passive:true});
      imgEl.addEventListener('touchend', e => {
        const dx = Math.abs(e.changedTouches[0].clientX - startX);
        const dy = Math.abs(e.changedTouches[0].clientY - startY);
        // Solo abrir lightbox si el swipe es claramente horizontal
        if (dx > 40 && dx > dy * 2) abrirLightbox(p.id, 0);
      }, {passive:true});
    }
  });
}

// ══════════════════════════════════════════════
//  POPUP PRODUCTO
// ══════════════════════════════════════════════
let popupProductoActual = null;
let popupTallaSeleccionada = '';

function pedirProducto(prodId) {
  const p = productos.find(x => String(x.id) === String(prodId));
  if (!p || p.estado === 'agotado') return;
  popupProductoActual = p;
  popupTallaSeleccionada = '';

  // Thumb
  const thumbWrap = document.getElementById('popup-thumb-wrap');
  const img = (p.imagenes || [])[0];
  thumbWrap.innerHTML = img
    ? `<img class="popup-thumb" src="${img}" alt="${p.nombre}">`
    : `<div class="popup-thumb-empty">🛍️</div>`;

  // Info
  document.getElementById('popup-nombre').textContent = p.nombre;
  document.getElementById('popup-desc').textContent   = p.descripcion || '';
  const mostrarPrecio = configTienda.mostrar_precios && p.precio > 0;
  if (mostrarPrecio) {
    const descuento = p.en_descuento && p.precio_original > 0;
    document.getElementById('popup-precio').innerHTML = descuento
      ? `<span style="text-decoration:line-through;color:var(--muted);font-size:.8rem;margin-right:4px;">${moneda} ${p.precio_original.toFixed(2)}</span>
         ${moneda} ${p.precio.toFixed(2)}
         <span style="background:#e74c3c;color:#fff;font-size:.65rem;font-weight:700;padding:2px 7px;border-radius:20px;margin-left:4px;">-${Math.round((1-p.precio/p.precio_original)*100)}%</span>`
      : `${moneda} ${p.precio.toFixed(2)}`;
  } else {
    document.getElementById('popup-precio').textContent = '';
  }

  // Tallas
  const tallas = p.tallas || [];
  const seccion = document.getElementById('popup-tallas-section');
  const grid    = document.getElementById('popup-tallas-grid');
  document.getElementById('popup-talla-aviso').style.display = 'none';

  if (tallas.length > 0) {
    seccion.style.display = 'block';
    grid.innerHTML = tallas.map(t => `
      <button class="talla-btn" onclick="elegirTallaPopup('${t}', this)">${t}</button>
    `).join('');
    // Si hay una sola talla, seleccionarla automáticamente
    if (tallas.length === 1) {
      popupTallaSeleccionada = tallas[0];
      grid.querySelector('.talla-btn').classList.add('selected');
    }
  } else {
    seccion.style.display = 'none';
    popupTallaSeleccionada = 'Único';
  }

  // Consultar link
  const wa = configTienda.whatsapp || '';
  const msg = `Hola! Me interesa este producto:  *${p.nombre}*. ¿Me pueden dar más información?`;
  document.getElementById('btn-popup-consultar').href = wa
    ? `https://wa.me/${wa}?text=${encodeURIComponent(msg)}`
    : '#';

  document.getElementById('popup-producto').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function elegirTallaPopup(talla, btn) {
  document.querySelectorAll('.talla-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  popupTallaSeleccionada = talla;
  document.getElementById('popup-talla-aviso').style.display = 'none';
}

function agregarAlCarritoDesdePopup() {
  const p = popupProductoActual;
  if (!p) return;

  const tallas = p.tallas || [];
  if (tallas.length > 0 && !popupTallaSeleccionada) {
    document.getElementById('popup-talla-aviso').style.display = 'block';
    return;
  }

  carrito.push({
    id: p.id,
    nombre: p.nombre,
    talla: popupTallaSeleccionada,
    precio: p.precio || 0,
    imagen: (p.imagenes || [])[0] || ''
  });
  guardarCarrito();
  actualizarContadorCarrito();
  cerrarPopupDirecto();

  // Feedback visual en el contador
  const count = document.getElementById('carrito-count');
  count.style.transform = 'scale(1.4)';
  setTimeout(() => count.style.transform = 'scale(1)', 250);
}

function cerrarPopup(e) {
  if (e.target === document.getElementById('popup-producto')) cerrarPopupDirecto();
}

function cerrarPopupDirecto() {
  document.getElementById('popup-producto').classList.remove('open');
  document.body.style.overflow = '';
  popupProductoActual = null;
  popupTallaSeleccionada = '';
}

// ══════════════════════════════════════════════
//  COMPARTIR TIENDA
// ══════════════════════════════════════════════
function abrirCompartir() {
  const slug = getShopSlug();
  const url  = `${DOMINIO_PUBLICO}/${slug}`;
  document.getElementById('share-link-text').textContent = url;
  document.getElementById('share-qr-img').src =
    `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(url)}`;
  document.getElementById('popup-compartir').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function cerrarCompartir() {
  document.getElementById('popup-compartir').classList.remove('open');
  document.body.style.overflow = '';
}

async function copiarLinkTienda(ev) {
  const url = document.getElementById('share-link-text').textContent;
  const btn = (ev && ev.target) || document.querySelector('.share-link-box button');
  const original = btn.textContent;
  try {
    await navigator.clipboard.writeText(url);
    btn.textContent = '¡Listo!';
  } catch {
    // Fallback si el navegador bloquea el clipboard
    const temp = document.createElement('textarea');
    temp.value = url;
    document.body.appendChild(temp);
    temp.select();
    document.execCommand('copy');
    document.body.removeChild(temp);
    btn.textContent = '¡Listo!';
  }
  setTimeout(() => { btn.textContent = original; }, 1800);
}

async function compartirNativo() {
  const url = document.getElementById('share-link-text').textContent;
  const nombre = document.getElementById('tienda-nombre').textContent || 'Mi Tienda';
  if (navigator.share) {
    try { await navigator.share({ title: nombre, text: `Mira la tienda de ${nombre}`, url }); }
    catch {} // el usuario canceló, no hacer nada
  } else {
    copiarLinkTienda();
  }
}

// ══════════════════════════════════════════════
//  CARRITO
// ══════════════════════════════════════════════
function guardarCarrito() {
  localStorage.setItem(carritoKey(), JSON.stringify(carrito));
}

function actualizarContadorCarrito() {
  document.getElementById('carrito-count').textContent = carrito.length;
}

function mostrarCarrito() {
  document.getElementById('pagina-tienda').classList.add('oculto');
  document.getElementById('pagina-carrito').classList.remove('oculto');
  renderCarrito();
}

function mostrarTienda() {
  document.getElementById('pagina-carrito').classList.add('oculto');
  document.getElementById('pagina-tienda').classList.remove('oculto');
}

function renderCarrito() {
  const el = document.getElementById('carrito-items');
  if (!carrito.length) {
    el.innerHTML = '<p style="text-align:center;color:#888;padding:30px;">Tu carrito está vacío</p>';
    document.getElementById('carrito-total-precio').textContent = '';
    document.getElementById('btn-enviar-whatsapp').href = '#';
    return;
  }

  const mostrarPrecio = configTienda.mostrar_precios;
  let total = 0;

  el.innerHTML = carrito.map((item, i) => {
    total += item.precio || 0;
    return `
      <div class="carrito-item">
        ${item.imagen
          ? `<img class="carrito-thumb" src="${item.imagen}" alt="${item.nombre}">`
          : `<div class="carrito-thumb-empty">🛍️</div>`}
        <div class="carrito-item-info">
          <div class="carrito-item-name">${item.nombre}</div>
          ${item.talla ? `<div class="carrito-item-talla">Talla: ${item.talla}</div>` : ''}
          ${mostrarPrecio && item.precio > 0 ? `<div class="carrito-item-precio">${moneda} ${item.precio.toFixed(2)}</div>` : ''}
        </div>
        <button class="btn-quitar" onclick="quitarDelCarrito(${i})">✕</button>
      </div>
    `;
  }).join('');

  document.getElementById('carrito-total-precio').textContent =
    mostrarPrecio ? `${moneda} ${total.toFixed(2)}` : '(precio por WhatsApp)';

  // Armar mensaje WhatsApp
  const wa = configTienda.whatsapp || '';
  if (wa) {
    const items = carrito.map(i => `• ${i.nombre}${i.talla ? ` (talla: ${i.talla})` : ''}${configTienda.mostrar_precios && i.precio > 0 ? ` - ${moneda} ${i.precio.toFixed(2)}` : ''}`).join('\n');
    const msg = `Hola! Me interesan estos productos:\n\n${items}\n\nQuiero hacer un pedido 😊`;
    document.getElementById('btn-enviar-whatsapp').href = `https://wa.me/${wa}?text=${encodeURIComponent(msg)}`;
  }
}

function quitarDelCarrito(i) {
  carrito.splice(i, 1);
  guardarCarrito();
  actualizarContadorCarrito();
  renderCarrito();
}

function vaciarCarrito() {
  carrito = [];
  guardarCarrito();
  actualizarContadorCarrito();
  renderCarrito();
}

// ══════════════════════════════════════════════
//  LIGHTBOX
// ══════════════════════════════════════════════
function abrirLightbox(prodId, index) {
  const p = productos.find(x => String(x.id) === String(prodId));
  if (!p || !p.imagenes?.length) return;
  lbImagenes = p.imagenes;
  lbIndex = index;
  document.getElementById('lightbox-nombre').textContent = p.nombre;
  actualizarLightbox();
  document.getElementById('lightbox-overlay').classList.add('open');
}

function actualizarLightbox() {
  document.getElementById('lightbox-img').src = lbImagenes[lbIndex];
  const dotsEl = document.getElementById('lightbox-dots');
  dotsEl.innerHTML = lbImagenes.map((_, i) =>
    `<div class="lb-dot${i === lbIndex ? ' active' : ''}"></div>`
  ).join('');
  document.getElementById('lightbox-prev').style.display = lbImagenes.length > 1 ? 'flex' : 'none';
  document.getElementById('lightbox-next').style.display = lbImagenes.length > 1 ? 'flex' : 'none';
}

function lbNavegar(dir) {
  lbIndex = (lbIndex + dir + lbImagenes.length) % lbImagenes.length;
  actualizarLightbox();
}

function cerrarLightbox() {
  document.getElementById('lightbox-overlay').classList.remove('open');
}

document.getElementById('lightbox-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('lightbox-overlay')) cerrarLightbox();
});

// Swipe táctil dentro del lightbox
(function() {
  const img = document.getElementById('lightbox-img');
  let sx = 0, sy = 0;
  img.addEventListener('touchstart', e => {
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
  }, {passive:true});
  img.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - sx;
    const dy = Math.abs(e.changedTouches[0].clientY - sy);
    if (Math.abs(dx) > 40 && Math.abs(dx) > dy * 1.5) {
      lbNavegar(dx < 0 ? 1 : -1);
    }
  }, {passive:true});
})();
</script>
